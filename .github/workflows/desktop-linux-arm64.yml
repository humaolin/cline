name: desktop-linux-arm64

# Standalone arm64 Linux desktop build.
#
# Why a separate workflow rather than a job in desktop-publish.yml: that file
# cannot produce anything in this fork. Its `validate` job gates on a hard-coded
# repository name, and its build jobs require the PublishDesktop environment's
# signing and telemetry secrets, none of which exist here. This workflow depends
# on nothing beyond the automatic GITHUB_TOKEN, so it can actually build and
# upload a bundle.
#
# Baseline: ubuntu-22.04-arm is the OLDEST system that still provides Tauri v2's
# required libwebkit2gtk-4.1-dev, which makes glibc 2.35 the lowest baseline
# this app can reach. A glibc 2.28 baseline is unreachable: the distributions
# that ship glibc 2.28 (Debian 10, AlmaLinux/RHEL 8) carry only the WebKitGTK
# 4.0 API, and a WebKitGTK 4.1 runtime itself needs glibc >= 2.31, so a 2.28 host
# could not load it even if the binary linked.
#
# tauri.release.conf.json is deliberately NOT applied: it sets
# bundle.createUpdaterArtifacts, which requires the minisign updater key. A plain
# build needs no key and produces the same deb/rpm, just without .sig files.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-linux-arm64.yml

permissions:
  contents: read

jobs:
  build:
    name: Build Linux (arm64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # Tauri's Linux build deps (WebKitGTK, GTK, the appindicator used by the
      # tray icon, librsvg for icons, xdo for the window helpers) plus upx, which
      # build-sidecar-bin.ts needs to UPX-pack the Linux SSH remote helpers it
      # bundles into the app. Every one of these exists for arm64 on 22.04.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential upx-ucl

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK packages
        run: bun run build:sdk

      # No --target: the runner is already arm64, so cargo builds for
      # aarch64-unknown-linux-gnu and Tauri's TAURI_ENV_TARGET_TRIPLE — which
      # build-sidecar-bin.ts derives the sidecar filename from — is that same
      # triple, so output stays under target/release/.
      #
      # deb and rpm only: linuxdeploy cannot process the Bun-compiled sidecar,
      # which aborts the AppImage target.
      - name: Build desktop bundles
        working-directory: apps/examples/desktop-app
        run: bunx tauri build --bundles deb,rpm

      - name: Collect artifacts
        working-directory: apps/examples/desktop-app
        run: |
          OUT="dist/publish"
          mkdir -p "$OUT"
          VERSION=$(node -p "require('./package.json').version")

          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          if [ -z "$DEB" ]; then
            echo "no deb produced under src-tauri/target/release/bundle/deb"
            exit 1
          fi
          cp "$DEB" "$OUT/Cline_${VERSION}_arm64.deb"

          RPM=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' -print -quit)
          if [ -z "$RPM" ]; then
            echo "no rpm produced under src-tauri/target/release/bundle/rpm"
            exit 1
          fi
          cp "$RPM" "$OUT/Cline_${VERSION}_aarch64.rpm"

          ls -lh "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-arm64
          retention-days: 30
          path: apps/examples/desktop-app/dist/publish/*
          if-no-files-found: error